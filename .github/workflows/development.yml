name: Development

on:
  pull_request:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  test:
    name: Development
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run code check for SSR example
        run: pnpm --filter sveltext-ssr-example check

      - name: Run code check for SPA example
        run: pnpm --filter sveltext-spa-example check

      - name: Run code check for Svelte example
        run: pnpm --filter sveltext-svelte-example check

      - name: Install Playwright browsers
        run: pnpm --filter sveltext-tests exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test
